[build]
  command = "npm run build"
  publish = "dist"

# 1. Strict File Shield: Block public access to sensitive & source files
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.bak"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tsconfig.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/ydb-proxy/*"
  to = "https://docapi.serverless.yandexcloud.net/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/yandex-passport-proxy/*"
  to = "https://login.yandex.ru/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High-Performance Browser Caching & Security Headers (36 Standards)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self' https://docapi.serverless.yandexcloud.net https://storage.yandexcloud.net https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://login.yandex.ru https://oauth.yandex.ru https://*.yandex.ru https://*.yandex.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api-maps.yandex.ru https://*.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://yastatic.net; img-src 'self' data: blob: https://images.unsplash.com https://storage.yandexcloud.net https://avatars.yandex.net https://*.yandex.net https://*.yandex.ru https://avatars.mds.yandex.net https://api-maps.yandex.ru https://yastatic.net; font-src 'self' data: https://yastatic.net; connect-src 'self' https://docapi.serverless.yandexcloud.net https://storage.yandexcloud.net https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://login.yandex.ru https://oauth.yandex.ru https://*.yandex.ru https://*.yandex.net https://suggest-maps.yandex.ru https://geocode-maps.yandex.ru https://api-maps.yandex.ru https://yastatic.net; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none';"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

